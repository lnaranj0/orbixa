# Module boundaries (00-platform-foundation, spec "Módulos desacoplados").
# A module's internals (Domain, Application, Infrastructure, Presentation,
# Database) may depend on its own internals and on any module's Contracts.
# Nobody may depend on another module's internals.
deptrac:
  paths:
    - ./app
    - ./modules
  exclude_files:
    - '#/modules/[^/]+/Tests/#'
    - '#/modules/[^/]+/Database/Migrations/#'
  layers:
    - name: App
      collectors:
        - type: classLike
          value: '^App\\'
    - name: PlatformContracts
      collectors:
        - type: classLike
          value: '^Modules\\Platform\\Contracts\\'
    - name: PlatformInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Platform\\'
          must_not:
            - type: classLike
              value: '^Modules\\Platform\\Contracts\\'
    - name: IdentityTenancyContracts
      collectors:
        - type: classLike
          value: '^Modules\\IdentityTenancy\\Contracts\\'
    - name: IdentityTenancyInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\IdentityTenancy\\'
          must_not:
            - type: classLike
              value: '^Modules\\IdentityTenancy\\Contracts\\'
    - name: AccessContracts
      collectors:
        - type: classLike
          value: '^Modules\\Access\\Contracts\\'
    - name: AccessInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Access\\'
          must_not:
            - type: classLike
              value: '^Modules\\Access\\Contracts\\'
    - name: TeamsContracts
      collectors:
        - type: classLike
          value: '^Modules\\Teams\\Contracts\\'
    - name: TeamsInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Teams\\'
          must_not:
            - type: classLike
              value: '^Modules\\Teams\\Contracts\\'
    - name: PortfolioContracts
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Portfolio\\Contracts\\'
          must_not:
            - type: classLike
              value: '^Modules\\Portfolio\\Contracts\\Catalog\\'
    - name: PortfolioCatalogContracts
      collectors:
        - type: classLike
          value: '^Modules\\Portfolio\\Contracts\\Catalog\\'
    - name: PortfolioInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Portfolio\\'
          must_not:
            - type: classLike
              value: '^Modules\\Portfolio\\Contracts\\'
    - name: WorkContracts
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Work\\Contracts\\'
          must_not:
            - type: classLike
              value: '^Modules\\Work\\Contracts\\Monitoring\\'
            - type: classLike
              value: '^Modules\\Work\\Contracts\\Workflow\\'
            - type: classLike
              value: '^Modules\\Work\\Contracts\\Planning\\'
    # 05 review B5: actor-less category lookup, only for Planning.
    - name: WorkPlanningContracts
      collectors:
        - type: classLike
          value: '^Modules\\Work\\Contracts\\Planning\\'
    # 05 P2: the transition port; only Work (consumer) and Workflow (implementation).
    - name: WorkWorkflowContracts
      collectors:
        - type: classLike
          value: '^Modules\\Work\\Contracts\\Workflow\\'
    # 04 M7: trusted readers without an actor; only Monitoring may use them.
    - name: WorkMonitoringContracts
      collectors:
        - type: classLike
          value: '^Modules\\Work\\Contracts\\Monitoring\\'
    - name: WorkInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Work\\'
          must_not:
            - type: classLike
              value: '^Modules\\Work\\Contracts\\'
    - name: MonitoringContracts
      collectors:
        - type: classLike
          value: '^Modules\\Monitoring\\Contracts\\'
    - name: MonitoringInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Monitoring\\'
          must_not:
            - type: classLike
              value: '^Modules\\Monitoring\\Contracts\\'
    - name: WorkflowContracts
      collectors:
        - type: classLike
          value: '^Modules\\Workflow\\Contracts\\'
    - name: WorkflowInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Workflow\\'
          must_not:
            - type: classLike
              value: '^Modules\\Workflow\\Contracts\\'
    - name: PlanningContracts
      collectors:
        - type: classLike
          value: '^Modules\\Planning\\Contracts\\'
    - name: PlanningInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Planning\\'
          must_not:
            - type: classLike
              value: '^Modules\\Planning\\Contracts\\'
    - name: ReportingContracts
      collectors:
        - type: classLike
          value: '^Modules\\Reporting\\Contracts\\'
    - name: ReportingInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Reporting\\'
          must_not:
            - type: classLike
              value: '^Modules\\Reporting\\Contracts\\'
    - name: GitHubIntegrationContracts
      collectors:
        - type: classLike
          value: '^Modules\\GitHubIntegration\\Contracts\\'
    - name: GitHubIntegrationInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\GitHubIntegration\\'
          must_not:
            - type: classLike
              value: '^Modules\\GitHubIntegration\\Contracts\\'
    - name: AuditContracts
      collectors:
        - type: classLike
          value: '^Modules\\Audit\\Contracts\\'
    - name: AuditInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Audit\\'
          must_not:
            - type: classLike
              value: '^Modules\\Audit\\Contracts\\'
  ruleset:
    App:
      - PlatformContracts
      - AuditContracts
      - IdentityTenancyContracts
      - AccessContracts
      - TeamsContracts
      - PortfolioContracts
      - WorkContracts
      - MonitoringContracts
      - WorkflowContracts
      - PlanningContracts
      - ReportingContracts
      - GitHubIntegrationContracts
    PlatformContracts: ~
    PlatformInternals:
      - PlatformContracts
    IdentityTenancyContracts:
      - PlatformContracts
    IdentityTenancyInternals:
      - IdentityTenancyContracts
      - PlatformContracts
    AccessContracts:
      - PlatformContracts
    AccessInternals:
      - AccessContracts
      - IdentityTenancyContracts
      - PlatformContracts
    TeamsContracts:
      - PlatformContracts
      - IdentityTenancyContracts
      - AccessContracts
    TeamsInternals:
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    PortfolioContracts:
      - PlatformContracts
      - IdentityTenancyContracts
      - AccessContracts
      - TeamsContracts
    PortfolioInternals:
      - PortfolioContracts
      - PortfolioCatalogContracts
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    WorkContracts:
      - PlatformContracts
      - IdentityTenancyContracts
      - AccessContracts
      - TeamsContracts
      - PortfolioContracts
    WorkMonitoringContracts: ~
    WorkWorkflowContracts: ~
    WorkPlanningContracts: ~
    PortfolioCatalogContracts: ~
    WorkInternals:
      - WorkContracts
      - WorkMonitoringContracts
      - WorkWorkflowContracts
      - WorkPlanningContracts
      - PortfolioContracts
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    MonitoringContracts:
      - PlatformContracts
    MonitoringInternals:
      - MonitoringContracts
      - WorkMonitoringContracts
      - PortfolioCatalogContracts
      - WorkContracts
      - PortfolioContracts
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    WorkflowContracts:
      - PlatformContracts
    WorkflowInternals:
      - WorkflowContracts
      - WorkWorkflowContracts
      - WorkContracts
      - PortfolioContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    PlanningContracts:
      - PlatformContracts
    PlanningInternals:
      - PlanningContracts
      - WorkPlanningContracts
      - WorkContracts
      - PortfolioContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    ReportingContracts:
      - PlatformContracts
    ReportingInternals:
      - ReportingContracts
      - WorkContracts
      - IdentityTenancyContracts
      - PlatformContracts
    GitHubIntegrationContracts:
      - PlatformContracts
    GitHubIntegrationInternals:
      - GitHubIntegrationContracts
      - WorkContracts
      - PortfolioContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    AuditContracts:
      - PlatformContracts
    AuditInternals:
      - AuditContracts
      - PlatformContracts
