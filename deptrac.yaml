# Module boundaries (00-platform-foundation, spec "Módulos desacoplados").
# A module's internals (Domain, Application, Infrastructure, Presentation,
# Database) may depend on its own internals and on any module's Contracts.
# Nobody may depend on another module's internals.
deptrac:
  paths:
    - ./app
    - ./modules
  exclude_files:
    - '#/modules/[^/]+/Tests/#'
    - '#/modules/[^/]+/Database/Migrations/#'
  layers:
    - name: App
      collectors:
        - type: classLike
          value: '^App\\'
    - name: PlatformContracts
      collectors:
        - type: classLike
          value: '^Modules\\Platform\\Contracts\\'
    - name: PlatformInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Platform\\'
          must_not:
            - type: classLike
              value: '^Modules\\Platform\\Contracts\\'
    - name: IdentityTenancyContracts
      collectors:
        - type: classLike
          value: '^Modules\\IdentityTenancy\\Contracts\\'
    - name: IdentityTenancyInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\IdentityTenancy\\'
          must_not:
            - type: classLike
              value: '^Modules\\IdentityTenancy\\Contracts\\'
    - name: AccessContracts
      collectors:
        - type: classLike
          value: '^Modules\\Access\\Contracts\\'
    - name: AccessInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Access\\'
          must_not:
            - type: classLike
              value: '^Modules\\Access\\Contracts\\'
    - name: TeamsContracts
      collectors:
        - type: classLike
          value: '^Modules\\Teams\\Contracts\\'
    - name: TeamsInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Teams\\'
          must_not:
            - type: classLike
              value: '^Modules\\Teams\\Contracts\\'
    - name: PortfolioContracts
      collectors:
        - type: classLike
          value: '^Modules\\Portfolio\\Contracts\\'
    - name: PortfolioInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Portfolio\\'
          must_not:
            - type: classLike
              value: '^Modules\\Portfolio\\Contracts\\'
    - name: WorkContracts
      collectors:
        - type: classLike
          value: '^Modules\\Work\\Contracts\\'
    - name: WorkInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Work\\'
          must_not:
            - type: classLike
              value: '^Modules\\Work\\Contracts\\'
    - name: MonitoringContracts
      collectors:
        - type: classLike
          value: '^Modules\\Monitoring\\Contracts\\'
    - name: MonitoringInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Monitoring\\'
          must_not:
            - type: classLike
              value: '^Modules\\Monitoring\\Contracts\\'
    - name: AuditContracts
      collectors:
        - type: classLike
          value: '^Modules\\Audit\\Contracts\\'
    - name: AuditInternals
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^Modules\\Audit\\'
          must_not:
            - type: classLike
              value: '^Modules\\Audit\\Contracts\\'
  ruleset:
    App:
      - PlatformContracts
      - AuditContracts
      - IdentityTenancyContracts
      - AccessContracts
      - TeamsContracts
      - PortfolioContracts
      - WorkContracts
      - MonitoringContracts
    PlatformContracts: ~
    PlatformInternals:
      - PlatformContracts
    IdentityTenancyContracts:
      - PlatformContracts
    IdentityTenancyInternals:
      - IdentityTenancyContracts
      - PlatformContracts
    AccessContracts:
      - PlatformContracts
    AccessInternals:
      - AccessContracts
      - IdentityTenancyContracts
      - PlatformContracts
    TeamsContracts:
      - PlatformContracts
      - IdentityTenancyContracts
      - AccessContracts
    TeamsInternals:
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    PortfolioContracts:
      - PlatformContracts
      - IdentityTenancyContracts
      - AccessContracts
      - TeamsContracts
    PortfolioInternals:
      - PortfolioContracts
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    WorkContracts:
      - PlatformContracts
      - IdentityTenancyContracts
      - AccessContracts
      - TeamsContracts
      - PortfolioContracts
    WorkInternals:
      - WorkContracts
      - PortfolioContracts
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    MonitoringContracts:
      - PlatformContracts
    MonitoringInternals:
      - MonitoringContracts
      - WorkContracts
      - PortfolioContracts
      - TeamsContracts
      - IdentityTenancyContracts
      - AccessContracts
      - PlatformContracts
    AuditContracts:
      - PlatformContracts
    AuditInternals:
      - AuditContracts
      - PlatformContracts
